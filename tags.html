<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>标签 · 鸿渚の分享页</title>
    <meta name="description" content="按标签浏览资源">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tag-cloud-large {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-xl);
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: var(--space-xl);
            border: 1px solid var(--border-light);
        }
        .tag-item-large {
            background: var(--bg-page);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 1rem;
            color: var(--text-desc);
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: inline-block;
        }
        .tag-item-large:hover,
        .tag-item-large.active {
            background: var(--primary-500);
            color: #fff;
            border-color: var(--primary-500);
        }
        .tag-detail {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: var(--space-xl);
            border: 1px solid var(--border-light);
            margin-bottom: var(--space-xl);
        }
        .tag-detail h2 {
            font-size: 1.5rem;
            color: var(--primary-600);
            margin-bottom: var(--space-lg);
        }
        .tag-resource-item {
            display: flex;
            align-items: center;
            padding: var(--space-md);
            border-bottom: 1px dashed var(--border-light);
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
        }
        .tag-resource-item:hover {
            background: var(--bg-page);
            border-radius: var(--radius-card);
        }
        .tag-resource-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--primary-400), var(--secondary-400));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            margin-right: var(--space-md);
        }
        .tag-resource-info h4 { font-size: 1.1rem; margin-bottom: 4px; }
        .tag-resource-info p { color: var(--text-muted); font-size: 0.85rem; }
    </style>
</head>
<body>
    <main class="container">
        <div class="breadcrumb" id="breadcrumb"></div>

        <div id="tagCloudContainer" class="tag-cloud-large">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载标签中...</div>
        </div>

        <div id="tagDetailContainer" class="tag-detail" style="display:none;">
            <h2><i class="fas fa-hashtag" style="color:var(--primary-500);"></i>
                <span id="selectedTagName"></span></h2>
            <div id="tagResourcesList"></div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script>
        (async function () {
            await loadHeader();
            await loadFooter();
            renderBreadcrumb('tags');

            const cloud = document.getElementById('tagCloudContainer');
            const detail = document.getElementById('tagDetailContainer');
            const nameEl = document.getElementById('selectedTagName');
            const listEl = document.getElementById('tagResourcesList');

            let tagMap = new Map();

            try {
                const all = await loadAllResources('?t=' + Date.now());
                for (const res of all) {
                    let tags = res.meta.tags;
                    if (!tags) continue;
                    if (typeof tags === 'string') tags = tags.split(',').map(t => t.trim());
                    if (!Array.isArray(tags)) continue;
                    tags.map(t => t.replace(/^#/, '').trim()).filter(Boolean).forEach(tag => {
                        if (!tagMap.has(tag)) tagMap.set(tag, []);
                        tagMap.get(tag).push(res);
                    });
                }

                if (tagMap.size === 0) {
                    cloud.innerHTML = '<div class="empty-state">暂无标签</div>';
                    return;
                }

                const sorted = [...tagMap.entries()].sort((a, b) => b[1].length - a[1].length);
                cloud.innerHTML = sorted.map(([tag, list]) =>
                    `<a href="#${encodeURIComponent(tag)}" class="tag-item-large" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)} (${list.length})</a>`
                ).join('');

                cloud.querySelectorAll('.tag-item-large').forEach(el => {
                    el.addEventListener('click', e => {
                        e.preventDefault();
                        const tag = el.dataset.tag;
                        history.replaceState(null, '', '#' + encodeURIComponent(tag));
                        showTag(tag);
                    });
                });

                const hash = decodeURIComponent(location.hash.slice(1));
                if (hash && tagMap.has(hash)) showTag(hash);
            } catch (e) {
                cloud.innerHTML = `<div class="error-state">加载失败：${escapeHtml(e.message)}</div>`;
            }

            function showTag(tag) {
                const resources = tagMap.get(tag) || [];
                nameEl.textContent = tag;
                listEl.innerHTML = resources.length === 0
                    ? '<p class="empty-state">该标签下暂无资源</p>'
                    : resources.map(res => {
                        const m = res.meta;
                        return `
                            <a href="detail.html?id=${encodeURIComponent(m.id)}" class="tag-resource-item">
                                <div class="tag-resource-icon"><i class="fas ${m.icon || 'fa-star'}"></i></div>
                                <div class="tag-resource-info">
                                    <h4>${escapeHtml(m.title || '无题')}</h4>
                                    <p>${escapeHtml((m.description || '').slice(0, 80))}</p>
                                </div>
                            </a>`;
                    }).join('');

                document.querySelectorAll('.tag-item-large').forEach(el => {
                    el.classList.toggle('active', el.dataset.tag === tag);
                });

                detail.style.display = 'block';
                detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        })();
    </script>
</body>
</html>
